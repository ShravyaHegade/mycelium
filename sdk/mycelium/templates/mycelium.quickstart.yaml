# Mycelium on-ramp: stop duplicate tool execution on LangGraph retry.
# IDE/agent schema: mycelium config schema -o mycelium.schema.json
#
# Scaffolded with:  mycelium init   (default — start here)
# Full reference:   mycelium init --full
#
# Real bug: langgraph#7417: long tool calls redispatched while still running.
#
# Next:
#   1. Fill every <TODO: …> below; rename subagent_task to match your tool.
#   2. Install `mycelium-runtime[langgraph]`; ToolRuntime IDs are propagated.
#   3. Put subagent_task at the callable path below, then launch:
#        mycelium run --config mycelium.yaml -- python -m your_package.app
#      Or keep explicit code-level control with @config.apply.

config_version: 1

integrations:
  langgraph:
    enabled: true

transition:
  agent_id: "<TODO: fill with your agent id — used in transition keys and receipts>"
  policy_version: "<TODO: fill with your policy version string, e.g. 2026.07.1>"
  reclaim_requires_death_signal: true

action_ledger:
  storage: sqlite
  path: ./mycelium-ledger.db
  unclassified_policy: strict
  tools:
    - subagent_task

tools:
  subagent_task:
    callable: your_package.tools:subagent_task
    side_effect_class: non_idempotent_mutate
    # Optional Tool Contract (shape/capability only; not authorization):
    # operations: [run]
    # required_args: [prompt]
    # optional_args: []
    # argument_types: {prompt: string}
    # output_schema: {result: string}
    # capabilities: [subagent]
